name: Build LiquidGlass

on:
  workflow_dispatch:
    inputs:
      watermark:
        description: '购买者水印（wxid / QQ 号，用于泄露追踪；只允许字母数字_-，留空则不打水印）'
        required: false
        default: 'UNMARKED'
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos-roothide

jobs:
  build:
    name: Build (${{ matrix.build_variant }})
    runs-on: macos-15
    outputs:
      package_version: ${{ steps.bump.outputs.package_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # - build_variant: rootful
          - build_variant: rootless
          # - build_variant: roothide

    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> "$HOME/.theosrc"

      - name: Bump Package Version
        id: bump
        run: |
          VERSION="5.2.0-${{ github.run_number }}"
          echo "Using version: $VERSION"
          sed -i '' "s/^Version: .*/Version: ${VERSION}/" control
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout Theos (RootHide)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install Theos dependencies
        run: |
          brew install ldid dpkg xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Build Package
        env:
          # 输入值只通过环境变量进入 shell，不直接拼进命令，避免被注入
          INPUT_WATERMARK: ${{ github.event.inputs.watermark }}
        run: |
          WATERMARK="${INPUT_WATERMARK:-UNMARKED}"
          if ! printf '%s' "$WATERMARK" | grep -Eq '^[A-Za-z0-9_-]{1,64}$'; then
            echo "::error::水印只能包含字母、数字、下划线、连字符（1-64 位）"
            exit 1
          fi
          echo ">>> 水印：$WATERMARK"
          # AxsLiquidGlassBuild.mk 读取同名环境变量 AXS_WATERMARK
          export AXS_WATERMARK="$WATERMARK"
          sh build.sh "${{ matrix.build_variant }}"

          # 校验水印确实编进了 dylib，没命中就失败，避免把没水印的包发给买家
          HIT=0
          for f in $(find .theos/obj -name 'AxsLiquidGlass.dylib' 2>/dev/null); do
            if grep -a -q "AXLGWM_${WATERMARK}" "$f"; then
              echo ">>> 水印命中：$f"; HIT=1
            fi
          done
          [ "$HIT" = 1 ] || { echo "::error::dylib 中未找到水印 AXLGWM_${WATERMARK}"; exit 1; }
          echo "=== .deb files ==="
          find ./packages -name "*.deb" -type f



      # 只有 push 的开发包（水印 UNMARKED）发 Release。
      # 手动触发的带水印包只放 Artifacts：Release 对公开仓库任何人可下载，会暴露哪些 wxid 是付费用户。
      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.bump.outputs.package_version }}
          name: "LiquidGlass v${{ steps.bump.outputs.package_version }}"
          files: ./packages/*.deb
